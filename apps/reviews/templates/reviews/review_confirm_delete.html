{% extends 'base.html' %}

{% block title %}Delete Review - {{ object.movie.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card shadow-lg border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Delete Review</h4>
                </div>

                <div class="card-body">
                    <p class="mb-3">Are you sure you want to delete your review for <strong>{{ object.movie.title }}</strong>?</p>
                    
                    <div class="alert alert-warning mb-4">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        This action cannot be undone.
                    </div>

                    <div class="d-flex gap-2 justify-content-center">
                        <a href="{% url 'movies:movie_info' object.movie.pk %}" class="btn btn-secondary fw-bold">
                            <i class="bi bi-x-circle me-2"></i>Cancel
                        </a>
                        <form method="post" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger fw-bold">
                                <i class="bi bi-trash me-2"></i>Delete Review
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
