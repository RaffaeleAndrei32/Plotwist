<form method="get" action="{% url 'movies:list_movies' %}">
    <div class="row g-3 mb-3">
        {% for field in filter.form %}

            {% if field.label != "Title" %}
                {% comment %} Render labels {% endcomment %}
                <div class="col-md-4">
                    <label for="{{ field.id_for_label }}" class="form-label">
                        <strong>{{ field.label }}</strong>
                    </label>

                    {% comment %} Render fields {% endcomment %}
                    {% if field.field.choices %}
                        <select name="{{ field.name }}" id="{{ field.id_for_label }}" class="form-select">
                            {% for value, text in field.field.choices %}
                                <option value="{{ value }}" {% if field.value == value|stringformat:"s" %}selected{% endif %}>
                                    {{ text }}
                                </option>
                            {% endfor %}
                        </select>
                    {% else %}
                        <input type="{{ field.field.widget.input_type|default:'text' }}" 
                               name="{{ field.name }}" 
                               id="{{ field.id_for_label }}" 
                               value="{{ field.value|default_if_none:'' }}" 
                               class="form-control">
                    {% endif %}
                </div>
            {% endif %}
        {% endfor %}
    </div>

    <div class="row g-3">
        <div class="col-md-12 d-flex gap-2 justify-content-end">
            <a href="{% url 'movies:list_movies' %}" class="btn btn-secondary fw-bold shadow-sm">Clear</a>
            <button type="submit" class="btn btn-warning fw-bold shadow-sm">Filter</button>
        </div>
    </div>
</form>
