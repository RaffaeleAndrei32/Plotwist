{% load param_replace %}

{% if is_paginated %}
<nav aria-label="Page navigation" class="mt-4">
    <ul class="pagination justify-content-center">
        
        {% if page_obj.has_previous %}
            <li class="page-item">
                <a class="page-link text-dark bg-warning border-warning fw-bold" 
                   href="?{% param_replace page=page_obj.previous_page_number %}">
                    Previous
                </a>
            </li>
        {% endif %}

        <li class="page-item disabled">
            <span class="page-link bg-white text-dark border-light">
                Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
            </span>
        </li>

        {% if page_obj.has_next %}
            <li class="page-item">
                <a class="page-link text-dark bg-warning border-warning fw-bold" 
                   href="?{% param_replace page=page_obj.next_page_number %}">
                    Next
                </a>
            </li>
        {% endif %}

    </ul>
</nav>
{% endif %}
