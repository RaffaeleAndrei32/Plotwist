{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %} 

{% block title %} Add Movie {% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'users/css/style.css' %}">{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
      <h3>Add Movie </h3>
  </div>
  <div class="card-body">
    <form method="post"> {% csrf_token %}
        {{form | crispy}}
        <input type="submit" class="btn btn-warning fw-bold" value="ok">
        <a href="{% url 'home' %}" class="btn btn-danger text-dark fw-bold">
                exit
            </a>
    </form>
  </div>
</div>
{% endblock %}
