{% extends 'navbar.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Edit Movie{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'users/css/style.css' %}">{% endblock %}

{% block content %}
<div class="card col-md-6">
  <div class="card-header d-flex justify-content-center">
      <h3 class="mb-0">Edit Movie</h3>
  </div>
  <div class="card-body">
    <form method="post" enctype="multipart/form-data" novalidate> {% csrf_token %}
        {{ form|crispy }}
        <div class="d-flex justify-content-between mt-3">
          <a href="{% url 'movies:movie_info' object.pk %}" class="btn btn-secondary">Back</a>
          <div class="d-flex gap-2">
            <a href="{% url 'movies:delete_movie' object.pk %}" class="btn btn-danger">
              <i class="bi bi-trash me-1"></i>Delete
            </a>
            <button type="submit" class="btn btn-warning fw-bold">
              <i class="bi bi-save me-1"></i>Save
            </button>
          </div>
        </div>
    </form>
  </div>
</div>
{% endblock %}
