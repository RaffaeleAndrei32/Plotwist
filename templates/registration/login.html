{% extends 'navbar.html' %}
{% load static %}
{% load crispy_forms_tags %} 

{% block title %} Login {% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'users/css/style.css' %}">{% endblock %}


{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>Sign in</h3>
                </div>
                <div class="card-body">
                    <form method="post"> {% csrf_token %}
                        {{form | crispy}}
                        <input type="submit" class="btn btn-warning fw-bold" value="sign in">
                    </form>
                </div>
                <div class="card-footer text-muted">
                    <small>
                        Don't have an account? 
                        <a href="{% url 'register_user' %}">Register</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
