<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background-color: #333333; 
            
            /* Rimuove i margini bianchi di default del browser */
            margin: 0;
            padding: 0;
            
            /* Assicura che il colore copra tutto lo schermo anche se la pagina è vuota */
            min-height: 100vh; 
            
            /* Cambia il colore del testo in bianco per renderlo leggibile */
            color: white; 
        }
        
        .bg-imdb-black {
            background-color: #191919;
        }

        .imdb-logo {
            background-color: #f9b404; /* Il giallo IMDb */
            color: #000;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 1.2rem;
            line-height: 1;
        }
        .search-input {
            border: none;
        }
        .search-input:focus {
            box-shadow: none; /* Rimuove il bordo blu di default */
        }
        .nav-link {
            font-weight: 600; /* Testo leggermente grassetto */
            font-size: 0.9rem;
        }
        /* Rende il form di ricerca flessibile per occupare lo spazio centrale */
        .search-container {
            flex-grow: 1;
            max-width: 800px; /* Limite massimo larghezza come sito vero */
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-imdb-black py-2">
        <div class="container-fluid px-4">
            
            <div class="d-flex align-items-center me-3">
                <a class="navbar-brand me-3" href="#">
                    <span class="imdb-logo">PloTwist</span>
                </a>
                <a class="btn text-white fw-bold d-flex align-items-center gap-2 border-0" href="#">
                    <i class="bi bi-list fs-5"></i> Menu
                </a>
            </div>

            <form class="d-flex search-container mx-3">
                <div class="input-group">
                    <input type="text" class="form-control search-input" placeholder="Search movie title" aria-label="Search">
                    <button class="btn btn-light text-secondary" type="button">
                        < i class="bi bi-search"></i>
                    </button>
                </div>
            </form>

            <div class="d-flex align-items-center gap-5">
                <a href="#" class="nav-link text-white">Sign In</a>
                <a href="#" class="nav-link text-white">Register</a>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
