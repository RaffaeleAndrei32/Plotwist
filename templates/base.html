{% load static %} 
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {% block title%}  {% endblock %} </title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-imdb-black py-2">
        <div class="container-fluid px-4">
            
            <div class="d-flex align-items-center me-3">
                <a class="navbar-brand me-3" href="{% url 'home' %}">
                    <span class="imdb-logo">PloTwist</span>
                </a>
                <a class="btn text-white fw-bold d-flex align-items-center gap-2 border-0" href="#">
                    <i class="bi bi-list fs-5"></i> Menu
                </a>
            </div>

            <form class="d-flex search-container mx-3">
                <div class="input-group">
                    <input type="text" class="form-control search-input" placeholder="Search movie title" aria-label="Search">
                    <button class="btn btn-light text-secondary" type="button">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>

            <div class="d-flex align-items-center gap-5">
                <a href="#" class="nav-link text-white">Sign In</a>
                <!-- <a href="{% url 'register_user' %}" class="nav-link text-white">Register</a> -->
                <div class="dropdown">
                    <button class="btn dropdown-toggle text-white" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                        Register
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <li><a href="{% url 'register_user' %}" class="dropdown-item" href="#">as user</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a href="{% url 'register_moderator' %}" class="dropdown-item" href="#">as moderator</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top:50px">
        <div class="row justify-content-center">
            <div class="col-sm-6">
            <center>
                {% block content %}{%  endblock %}
                <br>
            </center>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
